<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>AICP Agent Collaboration</title>
  <!--
    标签页通常只给 favicon 16px 空间，因此这里使用专用的高对比简化版：保留 A、
    三个协作节点和紫青品牌色，去掉在小尺寸下会糊成黑块的半透明细线与虚线。
    画布外仍保持透明，不会重新出现用户明确要求移除的方形底色。
  -->
  <defs>
    <linearGradient id="favicon-surface" x1="7" y1="6" x2="41" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <path
    d="M24 3.5 42.5 14v20L24 44.5 5.5 34V14L24 3.5Z"
    fill="url(#favicon-surface)"
    stroke="#C4B5FD"
    stroke-width="1.5"
  />
  <path
    d="M14 36 24 11 34 36M18 27.5h12"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="24" cy="10.5" r="3.2" fill="#F0ABFC" stroke="#FFFFFF" stroke-width="1.4"/>
  <circle cx="13.5" cy="36" r="3.2" fill="#C084FC" stroke="#FFFFFF" stroke-width="1.4"/>
  <circle cx="34.5" cy="36" r="3.2" fill="#22D3EE" stroke="#FFFFFF" stroke-width="1.4"/>
</svg>
