[project]
name = "aicp-matching-v2"
version = "0.1.0"
description = "AICP Agent 选中率与履约成功率 Wide & Deep + ESMM 影子排序服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  # PyTorch 2.2 是最后仍为 Intel macOS 提供官方 wheel 的稳定系列；固定范围避免 uv
  # 在该机器选择只有 arm64 wheel 的新版后回退到不可控源码构建。
  "torch>=2.2,<2.3",
  "numpy>=1.26,<2",
  "onnx==1.17.0",
  "onnxruntime==1.19.2",
]

[project.scripts]
aicp-matching-v2 = "aicp_matching_v2.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicp_matching_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
